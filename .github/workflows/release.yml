name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            bin_name: zuv.exe
            asset_name: zuv-${{ github.ref_name }}-windows-x64.zip
          - os: ubuntu-latest
            target: linux-x64
            bin_name: zuv
            asset_name: zuv-${{ github.ref_name }}-linux-x64.tar.gz
          - os: macos-latest
            target: macos-arm64
            bin_name: zuv
            asset_name: zuv-${{ github.ref_name }}-macos-arm64.tar.gz

    steps:
      - name: Checkout Source (Pure Zuv)
        uses: actions/checkout@v4

      - name: Download Pre-built Compiler Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          try {
            gh release download --repo rohitsoni007/rujs --pattern "*${{ matrix.target }}*" --dir ./dist
          } catch {
            Write-Host "No release found on rohitsoni007/rujs, packaging source release."
          }
        continue-on-error: true

      - name: Download Pre-built Compiler Binary (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo rohitsoni007/rujs --pattern "*${{ matrix.target }}*" --dir ./dist 2>/dev/null || echo "No release found on rohitsoni007/rujs, packaging source release."
        continue-on-error: true

      - name: Package Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "./dist/${{ matrix.bin_name }}") {
            Copy-Item "./dist/${{ matrix.bin_name }}" "./${{ matrix.bin_name }}"
            Compress-Archive -Path "${{ matrix.bin_name }}", src, zuv.yml, README.md, LICENSE, CHANGELOG.md -DestinationPath ${{ matrix.asset_name }}
          } else {
            Compress-Archive -Path src, zuv.yml, README.md, LICENSE, CHANGELOG.md -DestinationPath ${{ matrix.asset_name }}
          }

      - name: Package Release Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -f "./dist/${{ matrix.bin_name }}" ]; then
            cp "./dist/${{ matrix.bin_name }}" "./${{ matrix.bin_name }}"
            tar -czvf ${{ matrix.asset_name }} "${{ matrix.bin_name }}" src zuv.yml README.md LICENSE CHANGELOG.md
          else
            tar -czvf ${{ matrix.asset_name }} src zuv.yml README.md LICENSE CHANGELOG.md
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zuv-${{ matrix.target }}
          path: ${{ matrix.asset_name }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
