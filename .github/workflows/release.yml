name: Release

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment to apply
        required: true
        default: patch
        type: choice
        options: [ patch, minor, major ]

env:
  BOOTSTRAP_REPOSITORY: zuv-lang/zuv
  # Set the BOOTSTRAP_RELEASE_TAG repository variable to upgrade this without editing the workflow.
  BOOTSTRAP_RELEASE_TAG: ${{ vars.BOOTSTRAP_RELEASE_TAG || 'v0.0.1' }}

permissions:
  contents: write
  pull-requests: read

# Serialize releases so two merged PRs cannot calculate the same next tag.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine Release Version
    # A closed pull request only creates a release when it was actually merged.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      target_commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Select target commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Calculate next semantic version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_type="$MANUAL_RELEASE_TYPE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')"
            matching_labels="$(grep -Ex 'release:(major|minor|patch)' <<< "$labels" || true)"
            if [ "$(sed '/^$/d' <<< "$matching_labels" | wc -l)" -gt 1 ]; then
              echo 'Use only one of: release:major, release:minor, release:patch.' >&2
              exit 1
            elif grep -qx 'release:major' <<< "$labels"; then
              release_type=major
            elif grep -qx 'release:minor' <<< "$labels"; then
              release_type=minor
            else
              release_type=patch
            fi
          fi

          latest_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n 1)"
          latest_version="${latest_tag#v}"
          if [ -z "$latest_tag" ]; then latest_version='0.0.0'; fi
          IFS=. read -r major minor patch <<< "$latest_version"

          case "$release_type" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported release type: $release_type" >&2; exit 1 ;;
          esac

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  package:
    name: Package Release (${{ matrix.target }})
    needs: determine-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            bin_name: zuv.exe
            asset_name: zuv-windows-x64.zip
          # - os: ubuntu-latest
          #   target: linux-x64
          #   bin_name: zuv
          #   asset_name: zuv-linux-x64.tar.gz
          # - os: macos-latest
          #   target: macos-arm64
          #   bin_name: zuv
          #   asset_name: zuv-macos-arm64.tar.gz

    steps:
      - name: Checkout Source (Pure Zuv)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-version.outputs.target_commit }}

      - name: Setup LLVM & LLD (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"

      - name: Install LLVM Runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Download Bootstrap Compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path ./bootstrap | Out-Null
          gh release download $env:BOOTSTRAP_RELEASE_TAG --repo $env:BOOTSTRAP_REPOSITORY --pattern "*${{ matrix.target }}*" --dir ./bootstrap
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Bootstrap compiler download failed."
            exit 1
          }
          Expand-Archive -Path "./bootstrap/zuv-windows-x64.zip" -DestinationPath ./bootstrap -Force
          # Flatten nested folder layouts (e.g. zuv-windows-x64/zuv.exe → bootstrap/zuv.exe)
          if (-not (Test-Path "./bootstrap/zuv.exe")) {
            $nested = Get-ChildItem ./bootstrap -Recurse -Filter "zuv.exe" -File | Select-Object -First 1
            if (-not $nested) {
              Write-Error "bootstrap zuv.exe not found after extract."
              Get-ChildItem ./bootstrap -Recurse | Select-Object -First 40 FullName | ForEach-Object { Write-Host $_ }
              exit 1
            }
            $srcDir = $nested.Directory.FullName
            Get-ChildItem $srcDir -Force | ForEach-Object {
              $dest = Join-Path "./bootstrap" $_.Name
              if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
              Move-Item $_.FullName $dest -Force
            }
            if (($srcDir -ne (Resolve-Path ./bootstrap).Path) -and (Test-Path $srcDir)) {
              Remove-Item $srcDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path "./bootstrap/zuv.exe")) {
            Write-Error "Failed to place bootstrap/zuv.exe"
            exit 1
          }
          Write-Host "Bootstrap compiler ready at ./bootstrap/zuv.exe"

      - name: Download Bootstrap Compiler (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./bootstrap
          if gh release download "$BOOTSTRAP_RELEASE_TAG" --repo "$BOOTSTRAP_REPOSITORY" --pattern "*${{ matrix.target }}*" --dir ./bootstrap; then
            tar -xzf "./bootstrap/zuv-${{ matrix.target }}.tar.gz" -C ./bootstrap
            if [ ! -f "./bootstrap/zuv" ]; then
              nested="$(find ./bootstrap -type f -name zuv | head -n 1)"
              if [ -n "$nested" ]; then
                src_dir="$(dirname "$nested")"
                shopt -s dotglob
                mv "$src_dir"/* ./bootstrap/ 2>/dev/null || true
                shopt -u dotglob
                rmdir "$src_dir" 2>/dev/null || true
              fi
            fi
            chmod +x "./bootstrap/zuv"
            if [ "$RUNNER_OS" = "macOS" ]; then
              install_name_tool -change /opt/homebrew/opt/llvm/lib/libLLVM.dylib "$(brew --prefix llvm)/lib/libLLVM.dylib" ./bootstrap/zuv
            fi
            echo "Bootstrap compiler ready at ./bootstrap/zuv"
          else
            echo "Bootstrap compiler download failed." >&2
            exit 1
          fi

      - name: Build Pure Zuv Self-Hosting Compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./bin | Out-Null
          if (Test-Path "./bootstrap") {
            $bootPath = (Get-Item "./bootstrap").FullName
            echo "$bootPath" >> $env:GITHUB_PATH
            if (Test-Path "./bootstrap/lld-link.exe") {
              Copy-Item "./bootstrap/lld-link.exe" "./bin/lld-link.exe" -Force
            }
          }
          Write-Host "Building self-hosting compiler using bootstrap compiler..."
          & "./bootstrap/${{ matrix.bin_name }}" build src/main.zv -o "./bin/${{ matrix.bin_name }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build self-hosting compiler."
            exit 1
          }
          if ($IsLinux -or $IsMacOS) {
            chmod +x "./bin/${{ matrix.bin_name }}"
            if ($IsMacOS) {
              install_name_tool -change /opt/homebrew/opt/llvm/lib/libLLVM.dylib "$(brew --prefix llvm)/lib/libLLVM.dylib" "./bin/${{ matrix.bin_name }}" 2>$null
            }
          }
          Write-Host "Successfully generated self-hosting compiler binary at ./bin/${{ matrix.bin_name }}"

      - name: Test Self-Hosting Compiler
        shell: pwsh
        run: |
          Write-Host "Testing compiled self-hosting binary..."
          & "./bin/${{ matrix.bin_name }}" --help
          & "./bin/${{ matrix.bin_name }}" test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Self-hosting compiler failed test suite validation."
            exit 1
          }

      - name: Package Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $lldPath = ""
          if ($cmd) { $lldPath = $cmd.Source }
          elseif (Test-Path "./bootstrap/lld-link.exe") { $lldPath = "./bootstrap/lld-link.exe" }
          elseif (Test-Path "$env:LLVM_PATH\bin\lld-link.exe") { $lldPath = "$env:LLVM_PATH\bin\lld-link.exe" }
          elseif (Test-Path "C:\Program Files\LLVM\bin\lld-link.exe") { $lldPath = "C:\Program Files\LLVM\bin\lld-link.exe" }

          if ($lldPath) {
            Copy-Item $lldPath "./bin/lld-link.exe" -Force
            Compress-Archive -Path "./bin/${{ matrix.bin_name }}", "./bin/lld-link.exe" -DestinationPath ${{ matrix.asset_name }}
          } else {
            Compress-Archive -Path "./bin/${{ matrix.bin_name }}" -DestinationPath ${{ matrix.asset_name }}
          }

      - name: Package Release Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C ./bin "${{ matrix.bin_name }}"

      - name: Package Release Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          install_name_tool -change /opt/homebrew/opt/llvm/lib/libLLVM.dylib "$(brew --prefix llvm)/lib/libLLVM.dylib" "./bin/${{ matrix.bin_name }}" 2>/dev/null || true
          tar -czvf ${{ matrix.asset_name }} -C ./bin "${{ matrix.bin_name }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zuv-${{ matrix.target }}
          path: ${{ matrix.asset_name }}

  publish:
    name: Publish GitHub Release
    needs: [determine-version, package]
    runs-on: ubuntu-latest
    if: needs.package.result == 'success'
    env:
      RELEASE_TAG: ${{ needs.determine-version.outputs.tag }}
      TARGET_COMMIT: ${{ needs.determine-version.outputs.target_commit }}

    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.TARGET_COMMIT }}
          files: release-assets/*
          generate_release_notes: true
